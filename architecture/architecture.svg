<svg xmlns="http://www.w3.org/2000/svg" width="960" height="880" viewBox="0 0 960 880" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="880" fill="#ffffff"/>
  <text x="480" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#0f2b46">SentinelOps — SOC Lab Architecture</text>
  <text x="480" y="66" text-anchor="middle" font-size="14" fill="#5a6b7b">Isolated host-only lab network 192.168.56.0/24 — no internet-facing systems, no production data</text>

  <!-- Lane 1: Endpoint -->
  <rect x="60" y="100" width="380" height="150" rx="10" fill="#eef4fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="80" y="128" font-size="16" font-weight="700" fill="#1a4971">1. Windows Endpoint (WIN-SOC-EP01)</text>
  <text x="80" y="152" font-size="13" fill="#26384a">Windows 11 Pro 22H2 — 192.168.56.20</text>
  <text x="80" y="176" font-size="13" fill="#26384a">• Security / System / Application event logs</text>
  <text x="80" y="196" font-size="13" fill="#26384a">• Sysmon v15 (EID 1,3,5,11,22 …)</text>
  <text x="80" y="216" font-size="13" fill="#26384a">• PowerShell Script Block Logging (EID 4104)</text>
  <text x="80" y="236" font-size="13" fill="#26384a">• Advanced Audit Policy (4624/4625/4688/4720/4732)</text>

  <!-- Attacker box -->
  <rect x="520" y="100" width="380" height="150" rx="10" fill="#fdeeee" stroke="#c53030" stroke-width="2"/>
  <text x="540" y="128" font-size="16" font-weight="700" fill="#8a2020">Lab Attack Simulator (LAB-ATTACK01)</text>
  <text x="540" y="152" font-size="13" fill="#26384a">192.168.56.30 — second VM, lab only</text>
  <text x="540" y="176" font-size="13" fill="#26384a">• Authentication failures (SMB / RDP)</text>
  <text x="540" y="196" font-size="13" fill="#26384a">• Benign PowerShell &amp; discovery commands</text>
  <text x="540" y="216" font-size="13" fill="#26384a">• Local account creation / group changes</text>
  <text x="540" y="236" font-size="13" fill="#26384a">No malware. No real payloads. No external targets.</text>
  <path d="M520 175 L448 175" stroke="#c53030" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#redarrow)"/>
  <text x="484" y="168" text-anchor="middle" font-size="11" fill="#8a2020">simulated</text>
  <text x="484" y="196" text-anchor="middle" font-size="11" fill="#8a2020">activity</text>

  <!-- Arrow 1 -->
  <path d="M250 250 L250 300" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="262" y="280" font-size="12" fill="#1a4971">Windows Event Log + Sysmon telemetry</text>

  <!-- Lane 2: Agent -->
  <rect x="60" y="300" width="380" height="110" rx="10" fill="#eef4fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="80" y="328" font-size="16" font-weight="700" fill="#1a4971">2. Wazuh Agent (Windows)</text>
  <text x="80" y="352" font-size="13" fill="#26384a">Reads eventchannel: Security, System,</text>
  <text x="80" y="372" font-size="13" fill="#26384a">Microsoft-Windows-Sysmon/Operational,</text>
  <text x="80" y="392" font-size="13" fill="#26384a">Microsoft-Windows-PowerShell/Operational</text>

  <!-- Arrow 2 -->
  <path d="M250 410 L250 470" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="262" y="436" font-size="12" fill="#1a4971">Encrypted agent channel</text>
  <text x="262" y="454" font-size="12" fill="#1a4971">TCP/1514 (enrollment TCP/1515)</text>

  <!-- Lane 3: Manager -->
  <rect x="60" y="470" width="840" height="150" rx="10" fill="#eefaf3" stroke="#2f855a" stroke-width="2"/>
  <text x="80" y="498" font-size="16" font-weight="700" fill="#22633f">3. Wazuh Manager + Indexer (Ubuntu Server 22.04 — 192.168.56.10)</text>
  <text x="80" y="524" font-size="13" fill="#26384a">Decoders  →  Rule engine (built-in ruleset + custom local_rules.xml 100100–100199)  →  Alerting</text>
  <text x="80" y="548" font-size="13" fill="#26384a">• Correlation: frequency / timeframe / same_field   • Severity levels 0–15   • MITRE ATT&amp;CK enrichment</text>
  <text x="80" y="572" font-size="13" fill="#26384a">• alerts.json  →  Filebeat  →  Wazuh Indexer (OpenSearch) index  wazuh-alerts-4.x-*</text>
  <text x="80" y="596" font-size="13" fill="#26384a">• File Integrity Monitoring, Security Configuration Assessment (SCA), Active Response (disabled in this lab)</text>

  <!-- Arrow 3 -->
  <path d="M480 620 L480 670" stroke="#2f855a" stroke-width="2.5" marker-end="url(#greenarrow)"/>
  <text x="492" y="650" font-size="12" fill="#22633f">Indexed alerts (HTTPS)</text>

  <!-- Lane 4: Dashboard -->
  <rect x="60" y="670" width="840" height="100" rx="10" fill="#fdf6e7" stroke="#b7791f" stroke-width="2"/>
  <text x="80" y="698" font-size="16" font-weight="700" fill="#8a5a0b">4. Wazuh Dashboard — https://192.168.56.10 (port 443)</text>
  <text x="80" y="722" font-size="13" fill="#26384a">Overview KPIs • Authentication panel • Endpoint activity • Alert timeline • MITRE ATT&amp;CK view • Discover / raw event search</text>
  <text x="80" y="746" font-size="13" fill="#26384a">Saved searches and visualisations used for triage and investigation</text>

  <!-- Arrow 4 -->
  <path d="M480 770 L480 812" stroke="#b7791f" stroke-width="2.5" marker-end="url(#goldarrow)"/>

  <!-- Lane 5: Analyst -->
  <rect x="280" y="812" width="400" height="52" rx="26" fill="#0f2b46"/>
  <text x="480" y="844" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">5. SOC L1 Analyst — Triage → Investigate → Respond → Document</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2b6cb0"/></marker>
    <marker id="greenarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f855a"/></marker>
    <marker id="goldarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b7791f"/></marker>
    <marker id="redarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c53030"/></marker>
  </defs>
</svg>
